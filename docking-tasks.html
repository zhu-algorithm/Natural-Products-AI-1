<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 对接任务</title><style>body{margin:0;background:#f5f8f7;color:#173338;font:14px/1.55 system-ui,"Microsoft YaHei"}header{background:#143738;color:#fff;padding:18px max(20px,calc((100% - 1050px)/2))}header a{color:#bde0d6}h1{margin:6px 0;font-size:24px}main{max-width:1050px;margin:auto;padding:24px 20px}.card{background:#fff;border:1px solid #dbe6e2;border-radius:9px;padding:17px;margin-bottom:16px}.note{background:#fff3d7;border-left:4px solid #d99f26;padding:10px 13px;color:#735519}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:11px;color:#607579;margin-top:10px}select,input{width:100%;padding:8px;border:1px solid #cbdad5;border-radius:6px;font:inherit}button{margin-top:12px;padding:9px 12px;background:#14715d;color:#fff;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #edf2ef}.tag{background:#fff3d7;color:#986400;padding:3px 7px;border-radius:12px;font-size:11px;font-weight:700}.out{white-space:pre-wrap;background:#f3f8f5;padding:11px;border-radius:7px;font:12px/1.5 ui-monospace,Consolas}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><body><header><a href="natural-product-ai-platform.html">← 返回工作台</a><h1>AI 对接任务与姿势审计</h1><small>任务编排 · 共识评分 · AI 姿势解释 · 反筛与 manifest</small></header><main><div class="note"><b>AI 姿势审计不等于结合预测。</b>AI 用于检查姿势与药效团/结构约束的相容性、跨构象稳定性和反筛冲突；只有通过回顾性基准后才允许前瞻筛选。</div><div class="grid"><section class="card"><h2>建立任务 manifest</h2><label>化合物</label><select id="c"><option>青蒿素 · CID 68827</option><option>淫羊藿苷 · CID 5318997</option><option>罗汉果皂苷 V · CID 24721270</option></select><label>靶点/结构</label><select id="t"><option>MAPK1 · PDB 4FV1</option><option>MMP9 · PDB 待选择</option><option>PPARG · PDB 待选择</option><option>TLR4 · 复合体待评审</option></select><label>已验证口袋/网格</label><input id="g" placeholder="填写共晶配体或验证的坐标"><button id="make">生成 AI 审计 manifest</button></section><section class="card"><h2>质量门</h2><table><tbody><tr><td>AI 构象/质子化覆盖</td><td><span class="tag">缺失</span></td></tr><tr><td>AI 口袋/低置信风险</td><td><span class="tag">缺失</span></td></tr><tr><td>回对接 RMSD ≤2 Å</td><td><span class="tag">未运行</span></td></tr><tr><td>活性物/诱饵 ROC、EF、CI</td><td><span class="tag">未运行</span></td></tr><tr><td>同源/安全性反筛</td><td><span class="tag">未运行</span></td></tr></tbody></table></section></div><section class="card"><h2>最新任务</h2><div id="out" class="out">尚未创建任务。</div></section></main><script>document.getElementById('make').onclick=()=>{let g=document.getElementById('g').value.trim();if(!g)return alert('必须填写经验证的口袋/网格。');out.textContent=JSON.stringify({task_id:'DCK-'+Date.now(),compound:c.value,target:t.value,pocket:g,status:'draft_blocked',ai_audit:['pose_pharmacophore_consistency','ensemble_stability','counter_screen_conflict','confidence_and_failure_reason'],required_validation:['redocking_RMSD<=2A','active_decoy_enrichment_bootstrap','orthogonal_experimental_test'],created_at:new Date().toISOString()},null,2)}</script></body></html>
