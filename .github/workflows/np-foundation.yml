name: NPFM tests
on:
  workflow_dispatch:
  push:
    paths: ["np-foundation/**", ".github/workflows/np-foundation.yml"]
  pull_request:
    paths: ["np-foundation/**", ".github/workflows/np-foundation.yml"]
jobs:
  cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: np-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,test]'
      - run: python -m pytest
