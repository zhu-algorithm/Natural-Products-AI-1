[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npfm"
version = "0.2.0"
description = "NP-GPT structural language modeling, molecular learning and traceable evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Natural Products AI project"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
train = ["torch>=2.4", "rdkit>=2024.3"]
test = ["pytest>=8"]
admet = ["admet-ai>=2.0"]
dock = ["vina>=1.2"]

[project.scripts]
npfm = "npfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
